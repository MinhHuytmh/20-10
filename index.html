<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Vanhh 20/10 Dui Dẻee! 🐸❤️</title>
    <!-- Font chữ lãng mạn & hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600;800&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <!-- Canvas Confetti cho hiệu ứng pháo hoa -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #ff758c;
            --secondary: #ff7eb3;
            --frog-green: #71b85f;
            --frog-dark: #4d8b3d;
            --accent: #ffd166;
            --bg-gradient: linear-gradient(135deg, #fce3ec 0%, #ffe8e8 50%, #e8f5e9 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Floating background items */
        .bg-element {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            opacity: 0.6;
            animation: floatSlow 8s infinite ease-in-out;
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(10deg); }
        }

        /* Main Container */
        .card-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 35px 25px;
            box-shadow: 0 20px 50px rgba(255, 117, 140, 0.25),
                        0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            text-align: center;
            transition: transform 0.5s ease;
        }

        .card-container:hover {
            transform: translateY(-5px);
        }

        /* Crown Header for Frog */
        .frog-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
            cursor: pointer;
        }

        /* Bé ếch nhảy lò co 3s nhịp nhàng */
        .frog-avatar {
            font-size: 85px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
            animation: frogHop 3s infinite ease-in-out;
            display: inline-block;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .frog-avatar:active {
            transform: scale(1.2) rotate(10deg);
        }

        .crown {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%) rotate(-5deg);
            font-size: 38px;
            animation: crownShimmer 2.5s infinite alternate ease-in-out;
        }

        @keyframes frogHop {
            0%, 100% { transform: translateY(0) scale(1); }
            35% { transform: translateY(-18px) scale(1.05) rotate(-3deg); }
            70% { transform: translateY(0) scale(0.98); }
        }

        @keyframes crownShimmer {
            0% { transform: translateX(-50%) rotate(-5deg) scale(1); }
            100% { transform: translateX(-50%) rotate(8deg) scale(1.15); }
        }

        /* Wish Message Style */
        .title-tag {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: white;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 4px 12px rgba(255, 117, 140, 0.3);
        }

        .main-wish {
            font-family: 'Dancing Script', cursive;
            font-size: 32px;
            color: #d63384;
            line-height: 1.35;
            margin-bottom: 25px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        .main-wish strong {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            color: #b71c1c;
            display: block;
            margin: 5px 0;
            background: linear-gradient(120deg, #e91e63, #9c27b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Interactive Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            border: none;
            outline: none;
            padding: 14px 24px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(45deg, #ff4e6d, #ff65a3);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 25px rgba(255, 117, 140, 0.4);
        }

        .btn-secondary {
            background: #e8f5e9;
            color: var(--frog-dark);
            border: 1.5px solid #a5d6a7;
        }

        .btn-secondary:hover {
            background: #c8e6c9;
            transform: translateY(-3px);
        }

        /* Floating Audio Control */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: white;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            transition: transform 0.3s ease;
        }

        .music-btn.playing {
            animation: spinMusic 4s linear infinite;
        }

        @keyframes spinMusic {
            100% { transform: rotate(360deg); }
        }

        /* Modal Secret Letter */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 25px;
            max-width: 400px;
            width: 85%;
            text-align: center;
            transform: scale(0.8) translateY(20px);
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            position: relative;
        }

        .modal.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #f0f0f0;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        /* Pop text effect (2.5s) */
        .pop-text {
            position: fixed;
            pointer-events: none;
            font-weight: bold;
            font-size: 22px;
            color: #ff4757;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 9999;
            animation: popUpFade 2.5s forwards cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes popUpFade {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            20% { opacity: 1; transform: translateY(-30px) scale(1.2); }
            80% { opacity: 1; transform: translateY(-70px) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(0.8); }
        }
    </style>
</head>
<body>

    <!-- Nút Bật/Tắt Nhạc -->
    <button class="music-btn" id="musicToggle" onclick="toggleMusic()" title="Bật/Tắt nhạc">🎵</button>
    
    <!-- Audio Nhạc Thành Đô Drill -->
    <audio id="bgMusic" loop preload="auto">
        <source src="thanh-do-drill.mp3" type="audio/mpeg">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
    </audio>

    <!-- Các họa tiết nền lơ lửng -->
    <div class="bg-element" style="top: 10%; left: 8%; font-size: 35px;">🐸</div>
    <div class="bg-element" style="top: 70%; left: 5%; font-size: 40px; animation-delay: 1s;">🌸</div>
    <div class="bg-element" style="top: 15%; right: 10%; font-size: 38px; animation-delay: 2s;">💖</div>
    <div class="bg-element" style="top: 75%; right: 8%; font-size: 35px; animation-delay: 3s;">🐸</div>

    <!-- Khung Card Chính -->
    <div class="card-container">
        <div class="title-tag">Special Day • 20/10</div>
        
        <div class="frog-wrapper" onclick="frogClick(event)">
            <span class="crown">👑</span>
            <div class="frog-avatar">🐸</div>
        </div>

        <div class="main-wish">
            Chúc <strong>Vanhh đẹp gái</strong> của anh 20/10 dui dẻee! ✨
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="openGift()">
                🎁 Bấm Vào Đây Để Nhận Quà
            </button>
            <button class="btn btn-secondary" onclick="shootHearts(event)">
                💚 Chạm Bé Ếch Thả Tim (2-3s)
            </button>
        </div>
    </div>

    <!-- Hộp Thư Bí Mật -->
    <div class="modal" id="giftModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeGift()">×</button>
            <div style="font-size: 50px; margin-bottom: 10px;">👑🐸💖</div>
            <h3 style="color: #d63384; font-size: 22px; margin-bottom: 12px; font-family: 'Playfair Display', serif;">
                Gửi Vanhh Dễ Thương!
            </h3>
            <p style="color: #555; line-height: 1.6; font-size: 15px; margin-bottom: 15px;">
                Chúc em ngày 20/10 luôn tràn ngập niềm vui, xinh đẹp rạng rỡ và luôn dui dẻee bên anh nhé! Cảm ơn Vanhh vì đã xuất hiện và làm mọi khoảnh khắc trở nên ngọt ngào hơn. 💕
            </p>
            <div style="font-size: 26px;">✨🌸🐸🎉✨</div>
        </div>
    </div>

    <script>
        const bgMusic = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicToggle');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                bgMusic.pause();
                musicBtn.classList.remove('playing');
                musicBtn.innerText = '🔇';
            } else {
                bgMusic.play().catch(e => console.log('Auto-play blocked'));
                musicBtn.classList.add('playing');
                musicBtn.innerText = '🎵';
            }
            isPlaying = !isPlaying;
        }

        // Tự động kéo dài thời gian pháo hoa & tim lơ lửng 2.5 - 3 giây
        function shootConfetti() {
            const duration = 2800; // 2.8 giây
            const animationEnd = Date.now() + duration;

            (function frame() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return;

                confetti({
                    particleCount: 3,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff758c', '#71b85f', '#ffd166', '#ffffff'],
                    ticks: 300,
                    gravity: 0.7
                });
                confetti({
                    particleCount: 3,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff758c', '#71b85f', '#ffd166', '#ffffff'],
                    ticks: 300,
                    gravity: 0.7
                });

                requestAnimationFrame(frame);
            }());
        }

        function openGift() {
            document.getElementById('giftModal').classList.add('active');
            shootConfetti();
            if (!isPlaying) toggleMusic();
        }

        function closeGift() {
            document.getElementById('giftModal').classList.remove('active');
        }

        // Hiệu ứng chữ nổi 2.5 giây khi bấm
        function createPopText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'pop-text';
            el.innerText = text;
            el.style.left = `${x - 40}px`;
            el.style.top = `${y - 20}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2500);
        }

        function frogClick(e) {
            const messages = ["Ếch ộp! 🐸", "Vanhh Siêu Đẹp Gái! ✨", "Yêu Vanhh Dui Dẻee! ❤️", "👑 Chú Ếch Hoàng Tử"];
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            createPopText(e.clientX, e.clientY, randomMsg);
            
            confetti({
                particleCount: 25,
                spread: 70,
                origin: { x: e.clientX / window.innerWidth, y: e.clientY / window.innerHeight },
                colors: ['#71b85f', '#ff758c'],
                ticks: 250,
                gravity: 0.6
            });
        }

        function shootHearts(e) {
            const emojis = ['💚', '🐸', '💖', '✨', '🌸'];
            const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            createPopText(e.clientX, e.clientY, randomEmoji + " 20/10 Dui Dẻee!");
            
            confetti({
                particleCount: 30,
                spread: 80,
                origin: { x: e.clientX / window.innerWidth, y: e.clientY / window.innerHeight },
                colors: ['#ff758c', '#ff7eb3', '#71b85f'],
                ticks: 280,
                gravity: 0.5
            });
        }
    </script>
</body>
</html>
